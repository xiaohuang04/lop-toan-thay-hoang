<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#FEF3C7"/>
  <!-- Arched segmented tail behind the head -->
  <path d="M100 154 C146 152 162 112 146 72 C136 48 114 38 96 44" fill="none" stroke="#B91C1C" stroke-width="18" stroke-linecap="round"/>
  <path d="M100 154 C146 152 162 112 146 72 C136 48 114 38 96 44" fill="none" stroke="#EF4444" stroke-width="12" stroke-linecap="round"/>
  <!-- Tail segment rings -->
  <circle cx="148" cy="116" r="7.5" fill="#DC2626"/>
  <circle cx="147" cy="88" r="7.5" fill="#DC2626"/>
  <circle cx="136" cy="60" r="7" fill="#DC2626"/>
  <circle cx="116" cy="45" r="6.5" fill="#DC2626"/>
  <!-- Cute golden stinger bulb -->
  <path d="M98 44 C86 38 78 46 82 55 C85 60 92 56 96 52 Z" fill="#F59E0B"/>
  <!-- Little side legs -->
  <path d="M62 132 L46 144 M64 142 L50 156 M138 132 L154 144 M136 142 L150 156" stroke="#B91C1C" stroke-width="5.5" stroke-linecap="round"/>
