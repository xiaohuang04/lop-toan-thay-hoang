<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#F3E8FF"/>
  <!-- Subtle mystical aura ring -->
  <circle cx="100" cy="100" r="82" fill="#E9D5FF" opacity="0.55"/>

  <!-- 4 pairs of sharp articulated arachnid legs -->
  <g fill="none" stroke="#3B0764" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left legs -->
    <polyline points="82,102 58,96 42,108"/>
    <polyline points="80,114 54,114 38,128"/>
    <polyline points="81,126 56,133 44,149"/>
    <polyline points="84,138 64,149 56,166"/>
    <!-- Right legs -->
    <polyline points="118,102 142,96 158,108"/>
    <polyline points="120,114 146,114 162,128"/>
    <polyline points="119,126 144,133 156,149"/>
    <polyline points="116,138 136,149 144,166"/>
  </g>

  <!-- Long forward-reaching muscular pedipalp arms -->
  <path d="M84,92 L60,82 L47,62" fill="none" stroke="#4C1D95" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M116,92 L140,82 L153,62" fill="none" stroke="#4C1D95" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left sleek crescent pincer claw (curving inward) -->
  <path d="M47,66 C32,54 34,32 54,26 C49,36 51,45 58,49 C57,41 62,33 70,32 C74,47 64,64 47,66 Z" fill="#581C87" stroke="#3B0764" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M44,54 C40,45 43,36 51,31" fill="none" stroke="#A855F7" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Right sleek crescent pincer claw (curving inward) -->
  <path d="M153,66 C168,54 166,32 146,26 C151,36 149,45 142,49 C143,41 138,33 130,32 C126,47 136,64 153,66 Z" fill="#581C87" stroke="#3B0764" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M156,54 C160,45 157,36 149,31" fill="none" stroke="#A855F7" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Narrow elongated armored carapace & segmented torso (NOT wide like a crab!) -->
  <path d="M100,76 C116,76 124,88 122,108 L117,144 C115,156 108,162 100,162 C92,162 85,156 83,144 L78,108 C76,88 84,76 100,76 Z" fill="#4C1D95" stroke="#2E1065" stroke-width="2.6"/>

  <!-- Overlapping armored dorsal chevron plates -->
  <path d="M81,106 Q100,113 119,106" fill="none" stroke="#2E1065" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M82,118 Q100,125 118,118" fill="none" stroke="#2E1065" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M84,130 Q100,137 116,130" fill="none" stroke="#2E1065" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M86,142 Q100,148 114,142" fill="none" stroke="#2E1065" stroke-width="3" stroke-linecap="round"/>

  <!-- Armor spine metallic highlights -->
  <path d="M89,102 Q100,106 111,102" fill="none" stroke="#9333EA" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M90,114 Q100,118 110,114" fill="none" stroke="#9333EA" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M91,126 Q100,130 109,126" fill="none" stroke="#9333EA" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Sharp glowing amber scorpion eyes & chelicerae fangs -->
  <polygon points="88,88 96,91 89,94" fill="#FBBF24"/>
  <polygon points="112,88 104,91 111,94" fill="#FBBF24"/>
  <path d="M94,77 L97,71 L100,76 L103,71 L106,77 Z" fill="#3B0764"/>

  <!-- Dramatic 5-segment armored metasoma tail arching high over the back -->
  <g stroke="#2E1065" stroke-width="2.4" stroke-linejoin="round">
    <!-- Segment 1 (tail base) -->
    <ellipse cx="100" cy="162" rx="11" ry="8.5" fill="#581C87"/>
    <!-- Segment 2 (curving back-right/up) -->
    <ellipse cx="100" cy="172" rx="9" ry="7.5" fill="#4C1D95"/>
    <!-- Segment 3 (rising along spine) -->
    <path d="M100,174 C122,174 134,154 128,132" fill="none" stroke="#2E1065" stroke-width="15" stroke-linecap="round"/>
    <path d="M100,174 C122,174 134,154 128,132" fill="none" stroke="#6B21A8" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- Articulated upper tail beads arching right over the center -->
  <g stroke="#2E1065" stroke-width="2.4">
    <ellipse cx="127" cy="144" rx="8.5" ry="10" transform="rotate(14 127 144)" fill="#581C87"/>
    <ellipse cx="131" cy="122" rx="8" ry="10" transform="rotate(-6 131 122)" fill="#6B21A8"/>
    <ellipse cx="127" cy="99" rx="7.5" ry="10" transform="rotate(-22 127 99)" fill="#7E22CE"/>
    <ellipse cx="117" cy="77" rx="7" ry="9.5" transform="rotate(-40 117 77)" fill="#6B21A8"/>
    <ellipse cx="103" cy="61" rx="7" ry="8.5" transform="rotate(-64 103 61)" fill="#7E22CE"/>
  </g>

  <!-- Glowing Amber-Gold Venom Bulb (Telson) + Razor-Sharp Curved Stinger -->
  <path d="M98,59 C86,57 82,45 90,38 C98,32 108,39 106,50 C105,55 102,58 98,59 Z" fill="#F59E0B" stroke="#92400E" stroke-width="2.2"/>
  <circle cx="95" cy="45" r="3" fill="#FEF08A"/>
  <!-- Curved razor stinger needle pointing forward-left -->
  <path d="M87,44 C76,44 68,51 64,61 C72,56 80,55 88,54 Z" fill="#FBBF24" stroke="#78350F" stroke-width="2" stroke-linejoin="round"/>
</svg>
