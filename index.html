<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lớp toán thầy Hoàng — Thi Online &amp; Mô Hình Tương Tác</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- AUTH SCREEN (Shown when not logged in) -->
  <div id="authScreen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div>
          <div class="brand-name" style="font-size:1.25rem;">Lớp toán thầy Hoàng</div>
          <div class="brand-sub">Cổng Thi Online &amp; Mô Hình Tương Tác</div>
        </div>
      </div>

      <h1 class="auth-title">Đăng nhập hệ thống</h1>
      <p class="auth-desc">Sử dụng tài khoản Giáo viên (Admin) hoặc tài khoản Học sinh được cấp.</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginUsername">Tên đăng nhập</label>
          <input id="loginUsername" class="input-control" type="text" placeholder="VD: admin hoặc hs01" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Mật khẩu</label>
          <input id="loginPassword" class="input-control" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required />
        </div>
        <div id="loginError" class="auth-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="btnLoginSubmit">
          Đăng nhập
        </button>
      </form>

      <div class="auth-demo-box">
        <div class="auth-demo-title">Tài khoản trải nghiệm nhanh:</div>
        <div class="auth-demo-grid">
          <button type="button" class="demo-account-btn" data-demo-user="admin" data-demo-pass="admin123">
            <span class="badge badge-p2">Giáo viên (Admin)</span>
            <strong>admin / admin123</strong>
            <small>Quản lý đề, giao bài, tạo HS</small>
          </button>
          <button type="button" class="demo-account-btn" data-demo-user="hs01" data-demo-pass="123456">
            <span class="badge badge-p1">Học sinh (12A1)</span>
            <strong>hs01 / 123456</strong>
            <small>Làm bài được giao, đổi hồ sơ</small>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- APP SHELL (Shown when authenticated) -->
  <div id="appShell" class="hidden">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand" id="brandHome" title="Về trang chính">
          <div class="brand-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">Lớp toán thầy Hoàng</span>
            <span class="brand-sub hidden" id="headerStatusBadge"></span>
          </div>
        </div>

        <nav class="main-tabs" role="tablist" aria-label="Chức năng chính">
          <button class="main-tab active" role="tab" aria-selected="true" data-tab="exam" id="tabBtnExam">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"/>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
            <span>Thi Online</span>
          </button>
          <button class="main-tab" role="tab" aria-selected="false" data-tab="lab" id="tabBtnLab">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"/>
              <polyline points="2 17 12 22 22 17"/>
              <polyline points="2 12 12 17 22 12"/>
            </svg>
            <span>Mô hình tương tác</span>
          </button>
        </nav>

        <div class="header-user-bar" id="headerUserBar">
          <div class="user-chip">
            <span class="badge" id="userRoleBadge">Admin</span>
            <span class="user-chip-name" id="userNameText">...</span>
          </div>
          <button class="btn btn-secondary btn-sm" id="btnLogout">Đăng xuất</button>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section id="panel-exam" class="tab-panel active" role="tabpanel" aria-labelledby="tabBtnExam">
        <div id="examRoot"></div>
      </section>

      <section id="panel-lab" class="tab-panel" role="tabpanel" aria-labelledby="tabBtnLab">
        <div id="labRoot"></div>
      </section>
    </main>
  </div>

  <!-- Generic Modal -->
  <div id="modalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard">
      <div class="modal-header">
        <h3 id="modalTitle">Thông báo</h3>
        <button class="icon-btn" id="modalCloseBtn" aria-label="Đóng">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
