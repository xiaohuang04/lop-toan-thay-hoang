<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4ed8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=20261123a" />
  <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg?v=20261123a" />
  <link rel="apple-touch-icon" href="/favicon.svg?v=20261123a" />
  <title>Lớp toán thầy Hoàng — Lớp Học, Thi Online &amp; Mô Hình Tương Tác</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="/css/styles.css?v=20261128i" />
</head>
<body>
  <!-- AUTH SCREEN (Shown when not logged in) -->
  <div id="authScreen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div>
          <div class="brand-name" style="font-size:1.25rem;">Lớp toán thầy Hoàng</div>
        </div>
      </div>

      <div id="authQuickBadge" class="badge badge-p2 hidden" style="margin-bottom:10px;">Truy cập nhanh • Sổ báo giảng</div>
      <h1 class="auth-title" id="authTitleText" style="margin-bottom:20px;">Đăng nhập hệ thống</h1>

      <form id="loginForm">
        <div class="form-group" id="loginUsernameGroup">
          <label for="loginUsername">Tên đăng nhập</label>
          <input id="loginUsername" class="input-control" type="text" placeholder="Nhập tên đăng nhập" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="loginPassword" id="loginPasswordLabel">Mật khẩu</label>
          <div class="password-input-wrap">
            <input id="loginPassword" class="input-control" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required />
            <button type="button" class="password-toggle-btn" id="btnToggleLoginPw" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
              <svg class="pw-icon-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="pw-icon-hide hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="loginError" class="auth-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="btnLoginSubmit">
          Đăng nhập
        </button>
        <div style="margin-top:14px; padding-top:14px; border-top:1px solid var(--border); text-align:center;">
          <button type="button" class="btn btn-secondary" style="width:100%;" id="btnGuestOpenReview">
            📖 Ôn tập kiến thức Toán THPT (Không cần đăng nhập) →
          </button>
        </div>
        <div id="authQuickSwitchWrap" class="hidden" style="text-align:center; margin-top:12px;">
          <button type="button" class="btn btn-ghost btn-sm" id="btnSwitchFullLogin">Đăng nhập bằng tài khoản khác</button>
        </div>
      </form>
    </div>
  </div>

  <!-- APP SHELL (Shown when authenticated) -->
  <div id="appShell" class="hidden">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand" id="brandHome" title="Về trang chính">
          <div class="brand-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">Lớp toán thầy Hoàng</span>
            <span class="brand-sub hidden" id="headerStatusBadge"></span>
          </div>
        </div>

        <nav class="main-tabs" role="tablist" aria-label="Chức năng chính">
          <button class="main-tab active" role="tab" aria-selected="true" data-tab="exam" data-tooltip="Quản lý lớp học" id="tabBtnExam">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span class="nav-tab-lbl" id="tabExamLabel">Lớp học của tôi</span>
          </button>
          <button class="main-tab" role="tab" aria-selected="false" data-tab="lab" data-tooltip="Mô hình tương tác" id="tabBtnLab">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"/>
              <polyline points="2 17 12 22 22 17"/>
              <polyline points="2 12 12 17 22 12"/>
            </svg>
            <span class="nav-tab-lbl">Mô hình tương tác</span>
          </button>
          <button class="main-tab" role="tab" aria-selected="false" data-tab="review" data-tooltip="Ôn tập" id="tabBtnReview">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
            <span class="nav-tab-lbl">Ôn tập</span>
          </button>
          <button class="main-tab hidden" role="tab" aria-selected="false" data-tab="slides" data-tooltip="Trình chiếu" id="tabBtnSlides">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
            <span class="nav-tab-lbl">Trình chiếu</span>
          </button>
          <button class="main-tab hidden" role="tab" aria-selected="false" data-tab="teaching-log" data-tooltip="Sổ báo giảng" id="tabBtnTeachingLog">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span class="nav-tab-lbl">Sổ báo giảng</span>
          </button>
          <button class="main-tab hidden" role="tab" aria-selected="false" data-tab="gradebook" data-tooltip="Sổ điểm" id="tabBtnGradebook">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"/>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
            <span class="nav-tab-lbl">Sổ điểm</span>
          </button>
          <button class="main-tab hidden" role="tab" aria-selected="false" data-tab="live-game" data-tooltip="Game tương tác" id="tabBtnLiveGame">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="12" rx="3"/>
              <line x1="6" y1="12" x2="10" y2="12"/>
              <line x1="8" y1="10" x2="8" y2="14"/>
              <circle cx="15" cy="11" r="1"/>
              <circle cx="17.5" cy="13" r="1"/>
            </svg>
            <span class="nav-tab-lbl">Game tương tác</span>
          </button>
        </nav>

        <div class="header-user-bar" id="headerUserBar">
          <button type="button" class="btn btn-primary btn-sm hidden" id="btnGuestGoLogin">Đăng nhập</button>
          <div class="user-menu-wrap u408-menu" id="userMenuWrap">
            <button type="button" class="u408-av" id="userMenuTrigger" aria-label="Mở menu tài khoản" aria-haspopup="menu" aria-expanded="false">
              <img class="u408-av-img hidden" id="userAvatarImg" alt="Ảnh đại diện" />
              <span class="u408-av-initials" id="userAvatarInitials">LH</span>
            </button>
            <span class="u408-dot" aria-hidden="true"></span>
            <div class="user-dropdown u408-m" id="userDropdown" role="menu" aria-label="Menu tài khoản">
              <div class="u408-hd" style="--i:0">
                <div class="u408-hd-top">
                  <b id="userNameText">...</b>
                  <span class="badge" id="userRoleBadge">Admin</span>
                </div>
                <span id="userSubMeta" class="u408-hd-sub"></span>
              </div>
              <button type="button" class="user-dropdown-item u408-it" id="menuItemProfile" role="menuitem" tabindex="-1" style="--i:1">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Hồ sơ cá nhân</span>
              </button>
              <button type="button" class="user-dropdown-item u408-it is-switch hidden" id="menuItemSwitchDemo" role="menuitem" tabindex="-1" style="--i:2">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                  <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                </svg>
                <span>Chuyển sang HS Demo</span>
              </button>
              <button type="button" class="user-dropdown-item u408-it is-switch hidden" id="menuItemSwitchAdmin" role="menuitem" tabindex="-1" style="--i:2">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                  <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                </svg>
                <span>Chuyển về Giáo viên</span>
              </button>
              <button type="button" class="user-dropdown-item u408-it hidden" id="menuItemStorage" role="menuitem" tabindex="-1" style="--i:3">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                </svg>
                <span>Quản lý bộ nhớ Supabase</span>
              </button>
              <button type="button" class="user-dropdown-item u408-it hidden" id="menuItemAiSettings" role="menuitem" tabindex="-1" style="--i:4">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2z"/>
                </svg>
                <span>Cài đặt Gemini AI (Đọc PDF)</span>
              </button>
              <button type="button" class="user-dropdown-item u408-it" id="menuItemChangePw" role="menuitem" tabindex="-1" style="--i:4">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span>Đổi mật khẩu</span>
              </button>
              <div class="user-dropdown-sep u408-hr" role="separator" style="--i:5"></div>
              <button type="button" class="user-dropdown-item u408-it is-danger is-out" id="menuItemLogout" role="menuitem" tabindex="-1" style="--i:6">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Đăng xuất</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section id="panel-exam" class="tab-panel active" role="tabpanel" aria-labelledby="tabBtnExam">
        <div id="examRoot"></div>
      </section>

      <section id="panel-lab" class="tab-panel" role="tabpanel" aria-labelledby="tabBtnLab">
        <div id="labRoot"></div>
      </section>

      <section id="panel-review" class="tab-panel" role="tabpanel" aria-labelledby="tabBtnReview">
        <div id="reviewRoot"></div>
      </section>

      <section id="panel-slides" class="tab-panel" role="tabpanel" aria-labelledby="tabBtnSlides">
        <div id="slidesRoot"></div>
      </section>

      <section id="panel-teaching-log" class="tab-panel" role="tabpanel" aria-labelledby="tabBtnTeachingLog">
        <div id="teachingLogRoot"></div>
      </section>

      <section id="panel-gradebook" class="tab-panel" role="tabpanel" aria-labelledby="tabBtnGradebook">
        <div id="gradebookRoot"></div>
      </section>

      <section id="panel-live-game" class="tab-panel" role="tabpanel" aria-labelledby="tabBtnLiveGame">
        <div id="liveGameRoot"></div>
      </section>
    </main>
  </div>

  <!-- Generic Modal -->
  <div id="modalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard">
      <div class="modal-header">
        <h3 id="modalTitle">Thông báo</h3>
        <button class="icon-btn" id="modalCloseBtn" aria-label="Đóng">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/js/app.js?v=20261128i"></script>
</body>
</html>
