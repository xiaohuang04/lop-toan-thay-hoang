<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lớp toán thầy Hoàng — Lớp Học, Thi Online &amp; Mô Hình Tương Tác</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <link rel="stylesheet" href="css/styles.css?v=20261122e" />
</head>
<body>
  <!-- AUTH SCREEN (Shown when not logged in) -->
  <div id="authScreen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <div>
          <div class="brand-name" style="font-size:1.25rem;">Lớp toán thầy Hoàng</div>
        </div>
      </div>

      <h1 class="auth-title" style="margin-bottom:20px;">Đăng nhập hệ thống</h1>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginUsername">Tên đăng nhập</label>
          <input id="loginUsername" class="input-control" type="text" placeholder="Nhập tên đăng nhập" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">Mật khẩu</label>
          <input id="loginPassword" class="input-control" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required />
        </div>
        <div id="loginError" class="auth-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" id="btnLoginSubmit">
          Đăng nhập
        </button>
      </form>
    </div>
  </div>

  <!-- APP SHELL (Shown when authenticated) -->
  <div id="appShell" class="hidden">
    <header class="app-header">
      <div class="header-inner">
        <div class="brand" id="brandHome" title="Về trang chính">
          <div class="brand-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <div class="brand-text">
            <span class="brand-name">Lớp toán thầy Hoàng</span>
            <span class="brand-sub hidden" id="headerStatusBadge"></span>
          </div>
        </div>

        <nav class="main-tabs" role="tablist" aria-label="Chức năng chính">
          <button class="main-tab active" role="tab" aria-selected="true" data-tab="exam" id="tabBtnExam">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span id="tabExamLabel">Lớp học của tôi</span>
          </button>
          <button class="main-tab" role="tab" aria-selected="false" data-tab="lab" id="tabBtnLab">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 2 7 12 12 22 7 12 2"/>
              <polyline points="2 17 12 22 22 17"/>
              <polyline points="2 12 12 17 22 12"/>
            </svg>
            <span>Mô hình tương tác</span>
          </button>
        </nav>

        <div class="header-user-bar" id="headerUserBar">
          <div class="user-menu-wrap" id="userMenuWrap">
            <button type="button" class="user-chip user-menu-trigger" id="userMenuTrigger" aria-haspopup="menu" aria-expanded="false">
              <span class="badge" id="userRoleBadge">Admin</span>
              <span class="user-chip-name" id="userNameText">...</span>
              <svg class="user-menu-chevron" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </button>
            <div class="user-dropdown hidden" id="userDropdown" role="menu">
              <button type="button" class="user-dropdown-item" id="menuItemProfile" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                </svg>
                <span>Hồ sơ cá nhân</span>
              </button>
              <button type="button" class="user-dropdown-item hidden" id="menuItemStorage" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
                </svg>
                <span>Quản lý bộ nhớ Supabase</span>
              </button>
              <button type="button" class="user-dropdown-item" id="menuItemChangePw" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span>Đổi mật khẩu</span>
              </button>
              <div class="user-dropdown-sep"></div>
              <button type="button" class="user-dropdown-item is-danger" id="menuItemLogout" role="menuitem">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Đăng xuất</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="app-main">
      <section id="panel-exam" class="tab-panel active" role="tabpanel" aria-labelledby="tabBtnExam">
        <div id="examRoot"></div>
      </section>

      <section id="panel-lab" class="tab-panel" role="tabpanel" aria-labelledby="tabBtnLab">
        <div id="labRoot"></div>
      </section>
    </main>
  </div>

  <!-- Generic Modal -->
  <div id="modalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modalCard">
      <div class="modal-header">
        <h3 id="modalTitle">Thông báo</h3>
        <button class="icon-btn" id="modalCloseBtn" aria-label="Đóng">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=20261122e"></script>
</body>
</html>
